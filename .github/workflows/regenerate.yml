name: regenerate-board
on:
  schedule:
    - cron: '29 19 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: orgs/cloud-itonami/cloud-itonami-isic-0111 }
      - uses: actions/checkout@v4
        with: {repository: kotoba-lang/langgraph, path: orgs/kotoba-lang/langgraph}
      - uses: actions/checkout@v4
        with: {repository: kotoba-lang/langchain, path: orgs/kotoba-lang/langchain}
      - uses: actions/checkout@v4
        with: {repository: kotoba-lang/langchain-store, path: orgs/kotoba-lang/langchain-store}
      - uses: actions/checkout@v4
        with: {repository: kotoba-lang/marketplace, path: orgs/kotoba-lang/marketplace}
      - uses: actions/checkout@v4
        with: {repository: kotoba-lang/kotobase-client, path: orgs/kotoba-lang/kotobase-client}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: regenerate
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-0111
        run: clojure -M:dev:render-html
      - name: verify
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-0111
        run: |
          grep -q 'Cereal' docs/samples/operator-console.html
          test "$(wc -c < docs/samples/operator-console.html)" -gt 30
          echo "ok"
      - name: commit when changed
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-0111
        run: |
          git add docs/
          if ! git diff --cached --quiet; then
            git config user.name "regenerate-board[bot]"
            git config user.email "noreply@github.com"
            git commit -m "chore: nightly regen"
            git push
          else
            echo "unchanged"
          fi
